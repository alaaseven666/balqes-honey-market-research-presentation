<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balqes | Research Presentations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Cairo:wght@300;400;600;700;800&display=swap');

:root {
    --brand-primary: #6ae499;
    --brand-secondary: #4fd1c5;
    --brand-white: #ffffff;
    --brand-pure-dark: #020601;

    --surface: #020601;
    --surface-elevated: #0e1c26;
    --surface-glass: rgba(255, 255, 255, 0.05);
    --border-glass: rgba(255, 255, 255, 0.1);
    --text-main: #ffffff;
    --text-muted: #a0aec0;
    --accent-adaptive: var(--brand-primary);
    --danger: #f87171;

    --bg-gradient: radial-gradient(circle at 10% 20%, rgba(106, 228, 153, 0.08) 0%, transparent 40%),
                   radial-gradient(circle at 90% 80%, rgba(79, 209, 197, 0.08) 0%, transparent 40%);

    --font-main: 'Sora', 'Segoe UI', sans-serif;
    --font-arabic: 'Cairo', 'Segoe UI', Tahoma, sans-serif;

    --spacing-xs: 0.5rem;
    --spacing-sm: 1rem;
    --spacing-md: 2rem;
    --spacing-lg: 4rem;
    --spacing-xl: 6rem;

    --border-radius: 20px;
    --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
    --surface: #f7fafc;
    --surface-elevated: #ffffff;
    --surface-glass: rgba(0, 0, 0, 0.03);
    --border-glass: rgba(0, 0, 0, 0.08);
    --text-main: #1a202c;
    --text-muted: #4a5568;
    --accent-adaptive: #1f8f5f;
    --bg-gradient: radial-gradient(circle at 10% 20%, rgba(106, 228, 153, 0.15) 0%, transparent 50%),
                   radial-gradient(circle at 90% 80%, rgba(79, 209, 197, 0.15) 0%, transparent 50%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html[lang="ar"] body { font-family: var(--font-arabic); }

body {
    background-color: var(--surface);
    color: var(--text-main);
    font-family: var(--font-main);
    line-height: 1.6;
    transition: background-color var(--transition), color 0.3s ease;
    min-height: 100vh;
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: var(--bg-gradient);
    z-index: -1;
}

a { text-decoration: none; color: inherit; }
button { font-family: inherit; }

/* Header */
header {
    padding: var(--spacing-sm) 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-glass);
    gap: 1rem;
    flex-wrap: wrap;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: 1px;
}

html[lang="ar"] .logo { letter-spacing: 0; }

.logo-icon {
    width: 40px;
    height: 40px;
    background: var(--brand-primary);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--brand-pure-dark);
    flex-shrink: 0;
}

.header-nav {
    display: flex;
    align-items: center;
    gap: var(--spacing-md);
}

.nav-link {
    font-weight: 700;
    font-size: 0.9rem;
    opacity: 0.6;
    cursor: pointer;
    background: none;
    border: none;
    color: inherit;
    padding: 0.5rem 0;
}

.nav-link:hover, .nav-link.active {
    opacity: 1;
    color: var(--accent-adaptive);
}

.header-actions { display: flex; gap: 10px; align-items: center; }

.action-btn {
    height: 44px;
    min-width: 44px;
    padding: 0 1rem;
    border-radius: 14px;
    border: 1px solid var(--border-glass);
    background: var(--surface-glass);
    color: var(--text-main);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: var(--transition);
    font-weight: 700;
    font-size: 0.85rem;
}

.action-btn:hover {
    background: var(--accent-adaptive);
    color: var(--brand-pure-dark);
    transform: translateY(-2px);
}

.action-btn.icon-only { padding: 0; }

/* Views */
.view { display: none; animation: fadeIn 0.5s ease forwards; }
.view.active { display: block; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Hero */
.hero {
    padding: var(--spacing-xl) 5% var(--spacing-lg);
    text-align: center;
    max-width: 900px;
    margin: 0 auto;
}

.hero span.eyebrow {
    display: inline-block;
    color: var(--accent-adaptive);
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 1rem;
}

.hero h1 {
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    font-weight: 800;
    letter-spacing: -1.5px;
    margin-bottom: 1rem;
}

[lang="ar"] .hero h1 { letter-spacing: 0; }

.hero p {
    color: var(--text-muted);
    font-size: 1.05rem;
    max-width: 640px;
    margin: 0 auto;
}

/* Card grid */
.grid-wrap { padding: 0 5% var(--spacing-xl); max-width: 1200px; margin: 0 auto; }

.link-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
}

.link-card {
    background: var(--surface-elevated);
    border: 1px solid var(--border-glass);
    border-radius: var(--border-radius);
    padding: 1.75rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    position: relative;
    overflow: hidden;
    transition: var(--transition), transform 0.15s ease, opacity 0.15s ease;
    cursor: grab;
    user-select: none;
}

.link-card:active { cursor: grabbing; }

.link-card:hover {
    border-color: var(--accent-adaptive);
    box-shadow: 0 24px 48px rgba(0,0,0,0.25);
    transform: translateY(-4px);
}

.link-card.dragging {
    opacity: 0.4;
    transform: scale(0.97);
    box-shadow: none;
}

.link-card .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
}

.card-num {
    font-size: 2.4rem;
    font-weight: 900;
    color: var(--accent-adaptive);
    opacity: 0.25;
    line-height: 1;
    font-family: 'Sora', sans-serif;
}

.card-title {
    font-weight: 700;
    font-size: 1.05rem;
}

.card-cta {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent-adaptive);
    font-weight: 700;
    font-size: 0.85rem;
}

.card-cta svg { transition: transform 0.3s ease; }
.link-card:hover .card-cta svg { transform: translate(3px, -3px); }
[dir="rtl"] .flip-rtl { transform: scaleX(-1); }
[dir="rtl"] .link-card:hover .card-cta .flip-rtl { transform: scaleX(-1) translate(3px, 3px); }

footer {
    text-align: center;
    padding: var(--spacing-md) 5% var(--spacing-lg);
    color: var(--text-muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border-glass);
}

footer strong { color: var(--accent-adaptive); }

/* Edit view */
.edit-wrap { padding: 0 5% var(--spacing-xl); max-width: 900px; margin: 0 auto; }

.edit-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 2rem;
}

.edit-row {
    background: var(--surface-elevated);
    border: 1px solid var(--border-glass);
    border-radius: var(--border-radius);
    padding: 1.25rem 1.5rem;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 1rem;
    align-items: start;
}

[dir="rtl"] .edit-row { direction: rtl; }

.edit-row-num {
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--accent-adaptive);
    opacity: 0.4;
    padding-top: 0.6rem;
}

.edit-row-fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.85rem;
}

.field label {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.field input {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 400;
    text-transform: none;
    letter-spacing: normal;
    color: var(--text-main);
    background: var(--surface-glass);
    border: 1px solid var(--border-glass);
    border-radius: 10px;
    padding: 0.65rem 0.85rem;
    transition: var(--transition);
    width: 100%;
}

.field input:focus {
    outline: none;
    border-color: var(--accent-adaptive);
}

.field input[dir="rtl"] { font-family: var(--font-arabic); }

.remove-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid var(--border-glass);
    background: transparent;
    color: var(--danger);
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.remove-btn:hover {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
}

.edit-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: space-between;
    align-items: center;
}

.edit-actions .left-actions,
.edit-actions .right-actions {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
}

.btn {
    padding: 0.85rem 1.5rem;
    border-radius: 14px;
    border: 1px solid var(--border-glass);
    background: var(--surface-glass);
    color: var(--text-main);
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: var(--transition);
}

.btn:hover { transform: translateY(-2px); }

.btn.primary {
    background: var(--accent-adaptive);
    color: var(--brand-pure-dark);
    border-color: var(--accent-adaptive);
}

.btn.primary:hover { box-shadow: 0 12px 24px rgba(106, 228, 153, 0.25); }

.btn.ghost:hover { border-color: var(--danger); color: var(--danger); }

.toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent-adaptive);
    color: var(--brand-pure-dark);
    padding: 0.85rem 1.5rem;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 999;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

@media (max-width: 640px) {
    .edit-row { grid-template-columns: auto 1fr; }
    .remove-btn { grid-column: 2; justify-self: end; }
}

@media (max-width: 1024px) {
    .link-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
    <div class="logo">
        <span id="logoText"></span>
    </div>

    <nav class="header-nav">
        <button class="nav-link active" id="navDirectory" data-view="directory"></button>
        <button class="nav-link" id="navEdit" data-view="edit"></button>
    </nav>

    <div class="header-actions">
        <button class="action-btn" id="langToggle"></button>
        <button class="action-btn icon-only" id="themeToggle" title="Toggle light/dark">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
    </div>
</header>

<main>
    <!-- DIRECTORY VIEW -->
    <section id="directoryView" class="view active">
        <div class="hero">
            <span class="eyebrow" id="dir-eyebrow"></span>
            <h1 id="dir-title"></h1>
            <p id="dir-sub"></p>
        </div>

        <div class="grid-wrap">
            <div class="link-grid" id="linkGrid"></div>
        </div>

        <footer id="dir-footer"></footer>
    </section>

    <!-- EDIT VIEW -->
    <section id="editView" class="view">
        <div class="hero">
            <span class="eyebrow" id="edit-eyebrow"></span>
            <h1 id="edit-title"></h1>
            <p id="edit-sub"></p>
        </div>

        <div class="edit-wrap">
            <div class="edit-list" id="editList"></div>

            <div class="edit-actions">
                <div class="left-actions">
                    <button class="btn" id="addBtn" type="button"></button>
                </div>
                <div class="right-actions">
                    <button class="btn ghost" id="restoreBtn" type="button"></button>
                    <button class="btn primary" id="saveBtn" type="button"></button>
                </div>
            </div>
        </div>
    </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* ---------- Data, i18n & storage (all local, no network dependency) ---------- */

const STORAGE_KEYS = {
    cards: 'balqes_cards_v1',
    theme: 'balqes_theme',
    lang: 'balqes_lang'
};

const DEFAULT_CARDS = [
    { id: 'card-1', titleAr: 'التحول الرقمي في سوق عسل النحل المصري', titleEn: 'Digital Transformation in the Egyptian Honey Market', url: 'https://gamma.app/docs/-9ulfhuunll38qjq' },
    { id: 'card-2', titleAr: 'سوق عسل النحل في مصر: خريطة المنافسة الاستراتيجية', titleEn: "Egypt's Honey Market: Strategic Competitive Landscape", url: 'https://gamma.app/docs/-bweouhpf2lz9x75' },
    { id: 'card-3', titleAr: 'استراتيجية التسويق الرقمي الثنائية بلقيس × ميلورا', titleEn: 'Balqes × Melora Dual Digital Marketing Strategy', url: 'https://gamma.app/docs/-3i4wuss9rvbb8t4' },
    { id: 'card-4', titleAr: 'تجربة المستخدم وتحسين التحويل في سوق العسل المصري', titleEn: "User Experience & Conversion Optimization in Egypt's Honey Market", url: 'https://gamma.app/docs/-1jbrx5xr10gy6ji' },
    { id: 'card-5', titleAr: 'دليل منتجات عسل النحل في السوق المصري', titleEn: 'Guide to Honey Products in the Egyptian Market', url: 'https://gamma.app/docs/-xl6wh54b5z0513b' },
    { id: 'card-6', titleAr: 'استراتيجية تميز بلقيس (Balqes)', titleEn: 'Balqes Differentiation Strategy', url: 'https://gamma.app/docs/Balqes-h1bq89pzl4kqqb9' },
    { id: 'card-7', titleAr: 'متابعة طلبات العملاء في تجارة العسل الإلكترونية بمصر', titleEn: "Customer Order Tracking in Egypt's E-Commerce Honey Trade", url: 'https://gamma.app/docs/-p8e411kq8638suo' },
    { id: 'card-8', titleAr: 'تقييم جودة العسل والتحقق من نقائه', titleEn: 'Honey Quality Assessment & Purity Verification', url: 'https://gamma.app/docs/-zbgc3uoj0wuiwnn' },
    { id: 'card-9', titleAr: 'تحليل حجم السوق المصري لعسل النحل', titleEn: 'Analysis of the Egyptian Honey Market Size', url: 'https://gamma.app/docs/-r3kljjn0syjoc7t' },
    { id: 'card-10', titleAr: 'تحولات سلوك المستهلك المصري في سوق عسل النحل', titleEn: 'Shifts in Egyptian Consumer Behavior in the Honey Market', url: 'https://gamma.app/docs/-x97f905gr1275uv' },
    { id: 'card-11', titleAr: 'قنوات التوزيع الرقمية لقطاع العسل في مصر: طفرة نمو استثنائية', titleEn: "Digital Distribution Channels for Egypt's Honey Sector: An Exceptional Growth Surge", url: 'https://gamma.app/docs/-x6sdjy1ytimk7x9' },
    { id: 'card-12', titleAr: 'معايير سلامة الغذاء ورقابة جودة عسل النحل في مصر', titleEn: 'Food Safety Standards & Quality Control for Honey in Egypt', url: 'https://gamma.app/docs/-k0upv6x2wdl6w0k' },
    { id: 'card-13', titleAr: 'دليل الامتثال التنظيمي لتجارة وتعبئة عسل النحل في مصر', titleEn: 'Regulatory Compliance Guide for Honey Trade & Packaging in Egypt', url: 'https://gamma.app/docs/-a60mj63s7fqzimb' },
    { id: 'card-14', titleAr: 'دليل استراتيجية تجارة العسل الرقمية في مصر', titleEn: 'Digital Honey Trade Strategy Guide in Egypt', url: 'https://gamma.app/docs/-bfwfx9icj44936o' }
];

const STRINGS = {
    en: {
        dir: 'ltr',
        logo: 'Balqes Honey',
        navDirectory: 'Directory',
        navEdit: 'Edit',
        eyebrowDir: 'RESEARCH DIRECTORY',
        heroTitle: 'Balqes Research Presentations',
        heroSub: 'A curated index of research documents hosted on Gamma. Drag any card to reorder it, or click to open the presentation in a new tab.',
        openCta: 'Open presentation',
        footerSuffix: 'presentations indexed · hosted on gamma.app',
        eyebrowEdit: 'EDIT MODE',
        editTitle: 'Edit Presentations',
        editSub: 'Update Arabic or English titles, update links, remove a card, or add a new one. Changes save on this computer only.',
        labelAr: 'Arabic Title',
        labelEn: 'English Title',
        labelUrl: 'Link URL',
        addCard: '+ Add Card',
        saveChanges: 'Save Changes',
        restoreDefaults: 'Restore Defaults',
        removeCard: 'Remove card',
        savedToast: 'Changes saved',
        restoreConfirm: 'Restore the default presentations? Any edits will be discarded.',
        urlPlaceholder: 'https://gamma.app/docs/...',
        titlePlaceholder: 'Untitled presentation'
    },
    ar: {
        dir: 'rtl',
        logo: 'عسل بلقيس',
        navDirectory: 'الدليل',
        navEdit: 'تعديل',
        eyebrowDir: 'دليل الأبحاث',
        heroTitle: 'عروض بلقيس البحثية',
        heroSub: 'فهرس منسّق للأبحاث المستضافة على Gamma. اسحب أي بطاقة لإعادة ترتيبها، أو انقر لفتح العرض في تبويب جديد.',
        openCta: 'فتح العرض',
        footerSuffix: 'عرضًا مفهرسًا · مستضاف على gamma.app',
        eyebrowEdit: 'وضع التعديل',
        editTitle: 'تعديل العروض',
        editSub: 'حدّث العناوين بالعربية أو الإنجليزية، أو الروابط، أو احذف بطاقة، أو أضف واحدة جديدة. تُحفظ التغييرات على هذا الجهاز فقط.',
        labelAr: 'العنوان بالعربية',
        labelEn: 'العنوان بالإنجليزية',
        labelUrl: 'رابط العرض',
        addCard: '+ إضافة بطاقة',
        saveChanges: 'حفظ التغييرات',
        restoreDefaults: 'استعادة الافتراضي',
        removeCard: 'حذف البطاقة',
        savedToast: 'تم الحفظ',
        restoreConfirm: 'هل تريد استعادة العروض الافتراضية؟ سيتم فقد أي تعديلات.',
        urlPlaceholder: 'https://gamma.app/docs/...',
        titlePlaceholder: 'عرض بدون عنوان'
    }
};

function loadCards() {
    try {
        const raw = localStorage.getItem(STORAGE_KEYS.cards);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length) return parsed;
        }
    } catch (e) { /* ignore corrupt storage, fall back to defaults */ }
    return DEFAULT_CARDS.map(c => ({ ...c }));
}

function saveCards(list) { localStorage.setItem(STORAGE_KEYS.cards, JSON.stringify(list)); }
function loadTheme() { return localStorage.getItem(STORAGE_KEYS.theme) || 'dark'; }
function saveTheme(t) { localStorage.setItem(STORAGE_KEYS.theme, t); }
function loadLang() { return localStorage.getItem(STORAGE_KEYS.lang) || 'ar'; }
function saveLang(l) { localStorage.setItem(STORAGE_KEYS.lang, l); }
function applyThemeAttr(t) { document.documentElement.setAttribute('data-theme', t); }
function applyLangAttrs(l) {
    document.documentElement.setAttribute('lang', l);
    document.documentElement.setAttribute('dir', STRINGS[l].dir);
}

function escapeHtml(str) {
    return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ---------- App state ---------- */

let cards = loadCards();
let lang = loadLang();
let theme = loadTheme();
let currentView = 'directory';
let dragEl = null;

const grid = document.getElementById('linkGrid');
const editList = document.getElementById('editList');

/* ---------- Rendering ---------- */

function render() {
    applyThemeAttr(theme);
    applyLangAttrs(lang);
    const t = STRINGS[lang];

    document.getElementById('logoText').textContent = t.logo;
    document.getElementById('navDirectory').textContent = t.navDirectory;
    document.getElementById('navEdit').textContent = t.navEdit;
    document.getElementById('langToggle').textContent = lang === 'ar' ? 'EN' : 'AR';

    document.getElementById('dir-eyebrow').textContent = t.eyebrowDir;
    document.getElementById('dir-title').textContent = t.heroTitle;
    document.getElementById('dir-sub').textContent = t.heroSub;
    document.getElementById('dir-footer').innerHTML = `<strong>${cards.length}</strong> ${t.footerSuffix}`;

    document.getElementById('edit-eyebrow').textContent = t.eyebrowEdit;
    document.getElementById('edit-title').textContent = t.editTitle;
    document.getElementById('edit-sub').textContent = t.editSub;
    document.getElementById('addBtn').textContent = t.addCard;
    document.getElementById('restoreBtn').textContent = t.restoreDefaults;
    document.getElementById('saveBtn').textContent = t.saveChanges;

    renderCards();
    renderEditRows();
}

function renderCards() {
    const t = STRINGS[lang];
    grid.innerHTML = cards.map((c, i) => `
        <div class="link-card" draggable="true" data-id="${c.id}" data-url="${escapeHtml(c.url)}" tabindex="0">
            <div class="card-top">
                <span class="card-num">${String(i + 1).padStart(2, '0')}</span>
            </div>
            <div>
                <div class="card-title">${escapeHtml((lang === 'ar' ? c.titleAr : c.titleEn) || t.titlePlaceholder)}</div>
            </div>
            <div class="card-cta">
                ${t.openCta}
                <svg class="flip-rtl" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
            </div>
        </div>
    `).join('');

    [...grid.children].forEach(attachCardBehavior);
}

function attachCardBehavior(card) {
    card.addEventListener('click', () => {
        const url = card.dataset.url;
        if (url) window.open(url, '_blank', 'noopener,noreferrer');
    });

    card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            const url = card.dataset.url;
            if (url) window.open(url, '_blank', 'noopener,noreferrer');
        }
    });

    card.addEventListener('dragstart', () => {
        dragEl = card;
        card.classList.add('dragging');
    });

    card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        dragEl = null;
        commitOrder();
    });

    card.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!dragEl || dragEl === card) return;
        const children = [...grid.children];
        const dragIdx = children.indexOf(dragEl);
        const overIdx = children.indexOf(card);
        if (dragIdx < overIdx) {
            grid.insertBefore(dragEl, card.nextSibling);
        } else {
            grid.insertBefore(dragEl, card);
        }
        renumber();
    });
}

function renumber() {
    [...grid.children].forEach((c, i) => {
        c.querySelector('.card-num').textContent = String(i + 1).padStart(2, '0');
    });
}

function commitOrder() {
    const ids = [...grid.children].map(c => c.dataset.id);
    cards = ids.map(id => cards.find(c => c.id === id)).filter(Boolean);
    saveCards(cards);
    document.getElementById('dir-footer').innerHTML = `<strong>${cards.length}</strong> ${STRINGS[lang].footerSuffix}`;
}

function renderEditRows() {
    const t = STRINGS[lang];
    editList.innerHTML = cards.map((c, i) => `
        <div class="edit-row" data-id="${c.id}">
            <div class="edit-row-num">${String(i + 1).padStart(2, '0')}</div>
            <div class="edit-row-fields">
                <div class="field">
                    <label>${t.labelAr}
                        <input type="text" dir="rtl" class="input-ar" value="${escapeHtml(c.titleAr)}">
                    </label>
                </div>
                <div class="field">
                    <label>${t.labelEn}
                        <input type="text" dir="ltr" class="input-en" value="${escapeHtml(c.titleEn)}">
                    </label>
                </div>
                <div class="field">
                    <label>${t.labelUrl}
                        <input type="url" dir="ltr" class="input-url" value="${escapeHtml(c.url)}" placeholder="${t.urlPlaceholder}">
                    </label>
                </div>
            </div>
            <button class="remove-btn" type="button" title="${t.removeCard}" aria-label="${t.removeCard}">&times;</button>
        </div>
    `).join('');

    editList.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            syncCardsFromDOM();
            const row = btn.closest('.edit-row');
            cards = cards.filter(c => c.id !== row.dataset.id);
            renderEditRows();
        });
    });
}

function syncCardsFromDOM() {
    const rows = [...editList.querySelectorAll('.edit-row')];
    if (!rows.length) return;
    cards = rows.map(row => ({
        id: row.dataset.id,
        titleAr: row.querySelector('.input-ar').value,
        titleEn: row.querySelector('.input-en').value,
        url: row.querySelector('.input-url').value
    }));
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2000);
}

/* ---------- View switching ---------- */

function showView(view) {
    currentView = view;
    document.getElementById('directoryView').classList.toggle('active', view === 'directory');
    document.getElementById('editView').classList.toggle('active', view === 'edit');
    document.getElementById('navDirectory').classList.toggle('active', view === 'directory');
    document.getElementById('navEdit').classList.toggle('active', view === 'edit');
    if (view === 'directory') {
        cards = loadCards();
        renderCards();
        document.getElementById('dir-footer').innerHTML = `<strong>${cards.length}</strong> ${STRINGS[lang].footerSuffix}`;
    }
}

document.getElementById('navDirectory').addEventListener('click', () => showView('directory'));
document.getElementById('navEdit').addEventListener('click', () => showView('edit'));

/* ---------- Edit actions ---------- */

document.getElementById('addBtn').addEventListener('click', () => {
    syncCardsFromDOM();
    cards.push({ id: 'card-' + Date.now(), titleAr: '', titleEn: '', url: '' });
    renderEditRows();
    const rows = editList.querySelectorAll('.edit-row');
    const lastRow = rows[rows.length - 1];
    if (lastRow) {
        lastRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        lastRow.querySelector('.input-ar').focus();
    }
});

document.getElementById('saveBtn').addEventListener('click', () => {
    syncCardsFromDOM();
    cards = cards
        .map(c => ({ ...c, titleAr: c.titleAr.trim(), titleEn: c.titleEn.trim(), url: c.url.trim() }))
        .filter(c => c.url);
    saveCards(cards);
    renderEditRows();
    showToast(STRINGS[lang].savedToast);
});

document.getElementById('restoreBtn').addEventListener('click', () => {
    if (!confirm(STRINGS[lang].restoreConfirm)) return;
    cards = DEFAULT_CARDS.map(c => ({ ...c }));
    saveCards(cards);
    renderEditRows();
});

/* ---------- Theme & language ---------- */

document.getElementById('themeToggle').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    saveTheme(theme);
    applyThemeAttr(theme);
});

document.getElementById('langToggle').addEventListener('click', () => {
    syncCardsFromDOM();
    lang = lang === 'ar' ? 'en' : 'ar';
    saveLang(lang);
    render();
});

render();
</script>

</body>
</html>
